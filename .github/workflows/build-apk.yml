name: Build Typhoon Radar APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Extract Android project
        run: unzip -q TyphoonRadar-Android-Source-2.zip -d source
      - name: Build APK
        run: gradle --no-daemon -p source/TyphoonRadar assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TyphoonRadar-debug-apk
          path: source/TyphoonRadar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14